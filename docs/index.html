<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Trippzy: your tickets, organised</title>
<meta name="description" content="Drop in your tickets. Trippzy organises your trip.">
<style>
  :root { color-scheme: light dark; --bg:#f7f7f5; --ink:#111110; --muted:#77746c; --line:rgba(17,17,16,.12); }
  @media (prefers-color-scheme: dark) { :root { --bg:#0b0b0c; --ink:#f4f4f1; --muted:#9a9891; --line:rgba(255,255,255,.14); } }
  body { margin:0; background:var(--bg); color:var(--ink); font:16px/1.65 system-ui,-apple-system,"Segoe UI",sans-serif; }
  main { max-width:640px; margin:0 auto; padding:72px 20px 96px; }
  h1 { font-size:44px; line-height:1.05; letter-spacing:-.04em; margin:0 0 14px; }
  p { color:var(--muted); font-size:18px; margin:0 0 28px; }
  nav { display:flex; flex-wrap:wrap; gap:10px; margin:0 0 40px; }
  a.btn { color:var(--ink); border:1px solid var(--line); border-radius:999px; padding:10px 18px; text-decoration:none; font-size:15px; }
  a.btn:hover { background:var(--line); }
  small { color:var(--muted); }
  a { color:inherit; }
</style>
</head>
<body>
<main>
  <h1>Throw in your tickets.<br>We organise your trip.</h1>
  <p>Trippzy reads your flight, train, bus and hotel bookings and turns them into one clear itinerary, with a note on when to leave for your next departure.</p>
  <nav>
    <a class="btn" href="legal/privacy.html">Privacy Policy</a>
    <a class="btn" href="legal/terms.html">Terms</a>
    <a class="btn" href="legal/delete-account.html">Delete your account</a>
  </nav>
  <small>Questions? <a href="mailto:support@trippzy.app">support@trippzy.app</a></small>
</main>
</body>
</html>
