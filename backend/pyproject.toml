[project]
name = "trippzy-api"
version = "0.1.0"
description = "Trippzy backend: FastAPI, MongoDB Atlas, Cloudflare R2, OpenRouter"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "pymongo>=4.10",
  "httpx>=0.27",
  "pyjwt[crypto]>=2.9",
  "boto3>=1.35",
  "pymupdf>=1.24",
  "pillow>=10.4",
  "airportsdata>=20240800",
  "cachetools>=5.5",
  "pycountry>=26.2.16",
  "tzdata>=2026.6",
  "zxing-cpp>=3.1.1",
  "numpy>=2.5.4",
]

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "mongomock-motor>=0.0.34",
  "ruff>=0.6",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 160
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]
"app/ai/prompts.py" = ["E501"]  # long prose prompts
